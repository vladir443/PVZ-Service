<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="themeColorMeta" name="theme-color" content="#f8faff" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pvz-group-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pvz-group-icon-180.png" />
    <link rel="preload" as="image" href="/icons/pvz-group-app-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/icons/nav-home.png" />
    <link rel="preload" as="image" href="/icons/nav-schedule.png" />
    <link rel="preload" as="image" href="/icons/nav-employees.png" />
    <link rel="preload" as="image" href="/icons/nav-profile.png" />
    <title>PVZ Group</title>
    <script>
      (() => {
        let initialTheme = "light";
        try {
          const savedTheme = localStorage.getItem("pvz_theme");
          initialTheme =
            savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : window.matchMedia?.("(prefers-color-scheme: dark)")?.matches
                ? "dark"
                : "light";
        } catch {
          initialTheme = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        }
        window.__PVZ_INITIAL_THEME__ = initialTheme;
        document.documentElement.style.colorScheme = initialTheme;
        document
          .getElementById("themeColorMeta")
          ?.setAttribute("content", initialTheme === "dark" ? "#0a111d" : "#f8faff");
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260809-3">
  </head>
  <body>
    <script>
      document.body.classList.toggle("theme-dark", window.__PVZ_INITIAL_THEME__ === "dark");
    </script>
    <div class="wrap">
      <div class="card">
        <h1 id="appTitle" class="app-title hidden"></h1>
        <div id="screen">
          <div class="app-loader">
            <div class="app-loader-content">
              <img class="app-loader-logo" src="/icons/pvz-group-app-icon-192.png" alt="" />
              <div class="app-loader-brand">PVZ Group</div>
              <div class="app-loader-status">
                <span class="app-loader-spinner" aria-hidden="true"></span>
                <span>Подключаемся…</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav id="bottomNav" class="bottom-nav"></nav>
    <div id="globalImageViewer" class="personal-finance-photo-viewer hidden" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
      <div class="personal-finance-photo-viewer-card">
        <button id="closeGlobalImageViewer" class="personal-finance-photo-close" type="button" aria-label="Закрыть">×</button>
        <img id="globalImageViewerImage" alt="Просмотр изображения" />
        <iframe id="globalDocumentViewerFrame" class="hidden" title="Просмотр документа"></iframe>
      </div>
    </div>

    <script src="/app.js?v=20260809-3" defer></script>
  </body>
</html>
